<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />

  <!-- PWA: Responsive -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PWA: Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- PWA: Theme color -->
  <meta name="theme-color" content="#AA6C39">

  <!-- iOS用設定（ホーム画面追加時の表示） -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="192image.png">

  <title>しのこ - PWA App</title>
<iframe src="NEW_WEB_APP_URL"></iframe>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>
  <!-- GAS Webアプリを全画面に埋め込み -->
  <iframe 
    src="https://script.google.com/a/macros/iica.jp/s/AKfycbyHmSQCHggqe4peAW_kU8QwXNVKb7jvc6ZJUUh2WvKDUtMIYpivujkCb0f6NLBGMwso/exec">
  </iframe>

  <!-- PWAインストール処理（必要なら） -->
  <script>
    window.addEventListener('load', () => {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js')
          .catch(err => console.log("SW registration failed:", err));
      }
    });
  </script>
</body>
</html>
